name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Fetch licensed low-poly robot models
        run: bash scripts/fetch_assets.sh

      - name: Import project and validate scripts
        run: |
          godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RogueMachines.apk
          test -s build/RogueMachines.apk
          ls -lh build/RogueMachines.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue-machines-android
          path: build/RogueMachines.apk
          if-no-files-found: error
          retention-days: 30
