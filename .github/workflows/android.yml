name: Android APK

on:
  push:
    branches: [main, feature/major-horror-overhaul, feature/gameplay-polish-settings-emotes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Fetch licensed low-poly robot models
        run: bash scripts/fetch_assets.sh

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/godot-import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi
          godot --headless --path . --script tests/startup_smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|SMOKE TEST FAILED" /tmp/godot-smoke.log; then
            echo "Godot startup smoke test failed."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RogueMachines.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/godot-export.log; then
            echo "Godot export reported engine or script errors."
            exit 1
          fi
          test -s build/RogueMachines.apk
          ls -lh build/RogueMachines.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue-machines-android
          path: build/RogueMachines.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Android APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android APK
          body: |
            Automated debug build of ROGUE MACHINES: LOST SIGNAL.
            Install on a compatible Android device. LAN multiplayer requires the same Wi-Fi network or hotspot.
          files: build/RogueMachines.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
